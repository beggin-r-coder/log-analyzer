spring.application.name=log-analyzer

# Every value marked ${NAME:default} can be set with an environment variable,
# which is how hosting platforms (Docker, Render, Railway, a VPS...) configure it.

# ---------- Server ----------
server.port=${PORT:8080}
# correct https:// URLs and client IPs behind a hosting proxy / load balancer
server.forward-headers-strategy=framework
server.compression.enabled=true
server.shutdown=graceful
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=${SESSION_TIMEOUT:8h}

# fingerprinted static files (dashboard.css -> dashboard-<hash>.css) can be cached for a year
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

# ---------- Login ----------
# Set APP_PASSWORD. If it is empty a random password is generated and printed in the log at startup.
app.security.enabled=${APP_SECURITY_ENABLED:true}
app.security.username=${APP_USERNAME:admin}
app.security.password=${APP_PASSWORD:}

# ---------- Health check for the hosting platform: GET /actuator/health ----------
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ---------- Branding (shown in the dashboard and PDF report) ----------
# NovaBank is a fictional demo bank; set your own name here.
app.brand.name=${BRAND_NAME:NovaBank}
app.brand.tagline=${BRAND_TAGLINE:BFSI Observability}

# ---------- AI error analysis (Google Gemini via AI Studio) ----------
# Get a key at https://aistudio.google.com/apikey and export it as GEMINI_API_KEY.
# Never commit the key. Without it the app uses its offline NLP analysis.
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
ai.gemini.timeout-seconds=60
# reuse a stored single-log analysis for this long before calling Gemini again
ai.cache-minutes=30
# safety cap on paid Gemini calls; beyond it the offline analysis is used until the hour passes
ai.max-calls-per-hour=${AI_MAX_CALLS_PER_HOUR:60}

# ---------- H2 persistent (file-based) database ----------
# The file lives in ${DATA_DIR}/bfsi-logs.mv.db. On a host, put DATA_DIR on a persistent volume.
spring.datasource.url=${DB_URL:jdbc:h2:file:${DATA_DIR:./data}/bfsi-logs;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

# H2 web console at /h2-console (behind the login). Turned off in the prod profile.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# ---------- Live BFSI log simulator (demo data) ----------
logs.simulator.enabled=${SIMULATOR_ENABLED:true}
# days of history generated the first time the database is empty
logs.simulator.seed-days=${SEED_DAYS:7}
# average events per minute (scaled by a banking-hours traffic curve)
logs.simulator.avg-per-minute=${SIMULATOR_RATE:12}
logs.simulator.interval-ms=2000
# time zone whose business hours shape the traffic curve
logs.simulator.business-zone=${BUSINESS_ZONE:Asia/Kolkata}
# records older than this are purged hourly
logs.retention-days=${RETENTION_DAYS:7}
