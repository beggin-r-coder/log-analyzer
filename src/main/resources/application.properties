spring.application.name=log-analyzer

# ---------- Branding (shown in the dashboard and PDF report) ----------
# NovaBank is a fictional demo bank; set your own name here.
app.brand.name=NovaBank
app.brand.tagline=BFSI Observability

# ---------- AI error analysis (Google Gemini via AI Studio) ----------
# Get a key at https://aistudio.google.com/apikey and export it as GEMINI_API_KEY.
# Never commit the key. Without it the app uses its offline NLP analysis.
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
ai.gemini.timeout-seconds=60
# reuse a stored single-log analysis for this long before calling Gemini again
ai.cache-minutes=30

# ---------- H2 persistent (file-based) database ----------
# Data survives restarts; the file lives in ./data/bfsi-logs.mv.db
spring.datasource.url=jdbc:h2:file:./data/bfsi-logs;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

# H2 web console: http://localhost:8080/h2-console  (JDBC URL as above, user "sa", empty password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- Live BFSI log simulator ----------
logs.simulator.enabled=true
# days of history generated the first time the database is empty
logs.simulator.seed-days=7
# average events per minute (scaled by a banking-hours traffic curve)
logs.simulator.avg-per-minute=12
logs.simulator.interval-ms=2000
# time zone whose business hours shape the traffic curve
logs.simulator.business-zone=Asia/Kolkata
# records older than this are purged hourly
logs.retention-days=7
