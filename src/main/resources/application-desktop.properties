# ---------------------------------------------------------------------------
# Desktop application (LogAnalyzer.exe / --desktop). Single user, local only.
# DATA_DIR, app.desktop.home, app.desktop.token and server.port are set by the launcher.
# ---------------------------------------------------------------------------
app.desktop.enabled=true
server.address=127.0.0.1
server.servlet.session.cookie.same-site=strict

# no login screen: the launcher's per-run token protects the local server instead
app.security.enabled=false
app.demo.enabled=false

# real logs come from Log sources, not from the simulator
logs.simulator.enabled=false
logs.retention-days=${RETENTION_DAYS:14}

spring.datasource.url=jdbc:h2:file:${DATA_DIR}/log-analyzer
spring.h2.console.enabled=false
spring.main.banner-mode=off

app.brand.name=${BRAND_NAME:Siebel CRM}
app.brand.tagline=${BRAND_TAGLINE:Log Analyzer}

logging.file.name=${app.desktop.home:.}/logs/log-analyzer.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=5
