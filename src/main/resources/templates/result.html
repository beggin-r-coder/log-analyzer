<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Log Analyzer Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<style>
body {
	background: #f4f6f9
}

.navbar-custom {
	background: #1f2937
}

.kpi-card {
	border: none;
	border-radius: 15px;
	color: white;
	box-shadow: 0 4px 12px rgba(0, 0, 0, .15)
}

.gradient-blue {
	background: linear-gradient(135deg, #007bff, #00c6ff)
}

.gradient-green {
	background: linear-gradient(135deg, #28a745, #6dd400)
}

.gradient-yellow {
	background: linear-gradient(135deg, #ffc107, #ff9800)
}

.gradient-red {
	background: linear-gradient(135deg, #dc3545, #ff4f81)
}

.dashboard-card {
	border: none;
	border-radius: 15px;
	box-shadow: 0 2px 10px rgba(0, 0, 0, .1)
}

.health-score {
	font-size: 34px;
	font-weight: bold;
	color: #198754
}

.incident-card {
	border-left: 5px solid #dc3545;
	padding: 10px;
	margin-bottom: 10px;
	background: white;
	border-radius: 10px
}
</style>
</head>
<body>
	<nav class="navbar navbar-dark navbar-custom">
		<div class="container">
			<span class="navbar-brand">AI Log Analyzer Dashboard</span>
		</div>
	</nav>
	<div class="container mt-4">
		<div class="row text-center">
			<div class="col-md-3 mb-3">
				<div class="card kpi-card gradient-blue">
					<div class="card-body">
						<h6>Total Logs</h6>
						<h2 th:text="${report.totalLogs}">0</h2>
					</div>
				</div>
			</div>
			<div class="col-md-3 mb-3">
				<div class="card kpi-card gradient-green">
					<div class="card-body">
						<h6>INFO Logs</h6>
						<h2 th:text="${report.infoLogs}">0</h2>
					</div>
				</div>
			</div>
			<div class="col-md-3 mb-3">
				<div class="card kpi-card gradient-yellow">
					<div class="card-body">
						<h6>WARN Logs</h6>
						<h2 th:text="${report.warnLogs}">0</h2>
					</div>
				</div>
			</div>
			<div class="col-md-3 mb-3">
				<div class="card kpi-card gradient-red">
					<div class="card-body">
						<h6>ERROR Logs</h6>
						<h2 th:text="${report.errorLogs}">0</h2>
					</div>
				</div>
			</div>
		</div>
		<div class="card dashboard-card mb-4">
			<div class="card-body text-center">
				<h5>System Health Score</h5>
				<div class="health-score">
					<span th:text="${#numbers.formatDecimal(report.healthScore,1,2)}">95</span>/100
				</div>
			</div>
		</div>
		<div class="row">
			<div class="col-md-6 mb-3">
				<div class="card dashboard-card">
					<div class="card-header">Log Distribution</div>
					<div class="card-body">
						<div style="width: 300px; height: 300px; margin: auto">
							<canvas id="logPieChart"></canvas>
						</div>
					</div>
				</div>
			</div>
			<div class="col-md-6 mb-3">
				<div class="card dashboard-card">
					<div class="card-header">Top Error Categories</div>
					<div class="card-body">
						<canvas id="errorBarChart"></canvas>
					</div>
				</div>
			</div>
		</div>
		<div class="card dashboard-card mt-4">
			<div class="card-header">Error Trend Timeline</div>
			<div class="card-body">
				<canvas id="trendChart"></canvas>
			</div>
		</div>
		<div class="card dashboard-card mt-4">
			<div class="card-header bg-danger text-white">Top Critical
				Incidents</div>
			<div class="card-body">
				<div class="incident-card"
					th:each="incident : ${report.criticalIncidents}">
					<h5 th:text="${incident.errorType}">Error</h5>
					<span class="badge bg-danger" th:text="${incident.severity}">HIGH</span>
					<p>
						Occurrences: <strong th:text="${incident.count}">0</strong>
					</p>
				</div>
			</div>
		</div>
		<div class="card dashboard-card mt-4">
			<div class="card-header">Error Breakdown</div>
			<div class="card-body">
				<table class="table table-hover">
					<thead class="table-dark">
						<tr>
							<th>Error Type</th>
							<th>Count</th>
							<th>Actions</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="entry : ${report.errorMap}">
							<td th:text="${entry.key}"></td>
							<td><span class="badge bg-danger" th:text="${entry.value}"></span></td>
							<td><a class="btn btn-outline-primary btn-sm"
								th:href="@{/error-details(type=${entry.key})}">View Logs</a></td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>

	<script th:inline="javascript">

    // Pie Chart Data

    const infoCount = [[${report.infoLogs}]];
    const warnCount = [[${report.warnLogs}]];
    const errorCount = [[${report.errorLogs}]];

    // Error Breakdown Data

    const errorLabels = [[${report.errorMap.keySet()}]];
    const errorValues = [[${report.errorMap.values()}]];

    // Hourly Trend Data

    const trendLabels =
        [[${report.hourlyErrors.keySet()}]];

    const trendValues =
        [[${report.hourlyErrors.values()}]];

    // ==========================
    // PIE CHART
    // ==========================

    new Chart(
        document.getElementById('logPieChart'),
        {
            type: 'doughnut',
            data: {
                labels: [
                    'INFO',
                    'WARN',
                    'ERROR'
                ],
                datasets: [{
                    data: [
                        infoCount,
                        warnCount,
                        errorCount
                    ],
                    backgroundColor: [
                        '#198754',
                        '#ffc107',
                        '#dc3545'
                    ]
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false
            }
        }
    );

    // ==========================
    // BAR CHART
    // ==========================

    new Chart(
        document.getElementById('errorBarChart'),
        {
            type: 'bar',
            data: {
                labels: errorLabels,
                datasets: [{
                    label: 'Occurrences',
                    data: errorValues,
                    backgroundColor: '#0d6efd'
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        display: false
                    }
                }
            }
        }
    );

    // ==========================
    // TREND CHART
    // ==========================

    new Chart(
        document.getElementById('trendChart'),
        {
            type: 'line',
            data: {
                labels: trendLabels,
                datasets: [{
                    label: 'Errors by Hour',
                    data: trendValues,
                    borderColor: '#dc3545',
                    backgroundColor: 'rgba(220,53,69,0.2)',
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true
            }
        }
    );

</script>
</body>
</html>
