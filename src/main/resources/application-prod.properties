# Production profile: activate with SPRING_PROFILES_ACTIVE=prod (the Docker image does this).

# no embedded TCP server for the database file; only this app opens it
spring.datasource.url=${DB_URL:jdbc:h2:file:${DATA_DIR:/app/data}/bfsi-logs}

# never expose the database console on a public server
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

# the host terminates HTTPS, so cookies must only travel over HTTPS
server.servlet.session.cookie.secure=${SECURE_COOKIES:true}

logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
