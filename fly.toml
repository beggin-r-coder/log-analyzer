# Fly.io demo: see README > Deploy > Fly.io.
# "fly launch" asks for a unique app name and updates the line below.
app = "log-analyzer-demo"
primary_region = "bom"            # Mumbai; change to a region near you (fly platform regions)

[build]
  dockerfile = "Dockerfile"

[env]
  DEMO_MODE = "true"
  SEED_DAYS = "2"
  PORT = "8080"
  JAVA_OPTS = "-Xmx256m -XX:MaxMetaspaceSize=128m -Xss512k -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"     # sleeps when idle; wakes on the next visit
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "90s"
    interval = "30s"
    method = "GET"
    path = "/actuator/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
